<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ShopLite</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">Shop<span>Lite</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">← Back to Store</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Log in to continue shopping or manage your store.</p>

      <div id="formError" class="form-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>

      <div class="demo-hint">
        <strong>Demo accounts:</strong><br>
        Admin — admin@shop.com / admin123<br>
        User — user@shop.com / user123
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script>
    void redirectIfLoggedIn('index.html');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('formError');

      try {
        const user = await SessionDB.login(email, password);
        window.location.href = user.role === 'admin' ? 'admin.html' : 'index.html';
      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
