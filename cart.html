<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — ShopLite</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">Shop<span>Lite</span></a>
      <div class="nav-links" id="authArea"></div>
      <div class="nav-links">
        <a href="cart.html" class="nav-link cart-link">
          🛒 Cart <span id="cartCount" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1>Your Cart</h1>
      <a href="index.html" class="nav-link">← Continue Shopping</a>
    </div>

    <div id="cartLayout" class="cart-layout">
      <div id="cartItemsList"></div>

      <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
        <div class="summary-row"><span>Tax (8%)</span><span id="sumTax">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="sumShipping">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
        <button id="checkoutBtn" class="btn btn-primary btn-block" style="margin-top:14px;">
          Proceed to Checkout
        </button>
      </div>
    </div>

    <div id="emptyCart" class="empty-state" style="display:none;">
      <h3>Your cart is empty</h3>
      <p>Browse the store and add something you like.</p>
      <a href="index.html" class="btn btn-primary" style="margin-top:14px;">Go to Store</a>
    </div>
  </main>

  <footer class="site-footer">
    ShopLite demo project — built with plain HTML, CSS &amp; JavaScript.
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
