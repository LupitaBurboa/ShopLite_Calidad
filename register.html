<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ShopLite</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">Shop<span>Lite</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">← Back to Store</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Create an account</h2>
      <p class="subtitle">Sign up to start shopping with ShopLite.</p>

      <div id="formError" class="form-error"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required placeholder="Repeat password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn('index.html');

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorBox = document.getElementById('formError');

      errorBox.classList.remove('show');

      if (password !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.classList.add('show');
        return;
      }
      if (password.length < 6) {
        errorBox.textContent = 'Password must be at least 6 characters.';
        errorBox.classList.add('show');
        return;
      }

      try {
        const user = UserDB.create({ name, email, password, role: 'user' });
        SessionDB.login(user);
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
