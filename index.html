<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopLite — Online Store</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">Shop<span>Lite</span></a>
      <div class="nav-links" id="authArea">
        <!-- filled by auth.js -->
      </div>
      <div class="nav-links">
        <a href="cart.html" class="nav-link cart-link">
          🛒 Cart <span id="cartCount" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <h1>Everything you need, in one place</h1>
    <p>Browse our catalog, add what you like to your cart, and check out in seconds.</p>
  </header>

  <main class="container">
    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="Search products...">
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>
      <select id="sortSelect">
        <option value="default">Sort: Default</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A–Z</option>
      </select>
    </div>

    <div id="productGrid" class="product-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      <h3>No products found</h3>
      <p>Try a different search term or category.</p>
    </div>
  </main>

  <footer class="site-footer">
    ShopLite demo project — built with plain HTML, CSS &amp; JavaScript. Data is stored locally in your browser.
  </footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
